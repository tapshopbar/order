<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TSB ORDER | TAP SHOP BAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F5F7;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#0E0E0E;-webkit-font-smoothing:antialiased;padding:24px}
.card{background:#fff;border-radius:24px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:14px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.label{letter-spacing:.32em;font-size:11px;color:#6B7280;font-weight:700}
h1{font-size:26px;margin:10px 0 8px;letter-spacing:-.02em}
p{color:#6B7280;font-size:14.5px;line-height:1.7;margin:0}
.badge{display:inline-block;margin-top:22px;background:#EAF1FF;color:#156DFF;font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px}
</style>
</head>
<body>
<div class="card">
 <div class="dots"><i style="background:#F43131"></i><i style="background:#156DFF"></i><i style="background:#FFC100"></i></div>
 <div class="label">TAP SHOP BAR</div>
 <h1>TSB ORDER</h1>
 <p>탭샵바 발주 시스템을 준비하고 있어요.<br>곧 이 주소에서 만나요.</p>
 <div class="badge">준비 중</div>
</div>
</body>
</html>
